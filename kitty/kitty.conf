#
# mappings
#
map alt+enter launch --location=vsplit --cwd=current
map alt+shift+enter launch --location=hsplit --cwd=current

map alt+n next_window
map alt+p previous_window

map alt+t new_tab
map alt+l next_tab
map alt+h previous_tab

map alt+1  goto_tab 1
map alt+2  goto_tab 2
map alt+3  goto_tab 3
map alt+4  goto_tab 4
map alt+5  goto_tab 5
map alt+6  goto_tab 6
map alt+7  goto_tab 7
map alt+8  goto_tab 8
map alt+9  goto_tab 9
map alt+10 goto_tab 10

#
# layout
#
enabled_layouts splits

#
# font
#
font_size   8.0
font_family family="Fira Code"

modify_font cell_width  0px
modify_font cell_height 4px

#
# tab bar
#
tab_bar_edge       top
tab_bar_style      separator
tab_separator      "::"
tab_title_template " <{title}> "
tab_bar_min_tabs   1

tab_bar_background      #574749
active_tab_background   #99966d
inactive_tab_background #574749
inactive_tab_foreground #b3a999

#
# window
#
draw_minimal_borders no
draw_window_borders_for_single_window yes

window_margin_width  5
window_padding_width 5
window_border_width  1pt

background_blur    64
background_opacity 0.9

active_border_color   #99966d
inactive_border_color #96514b

#
# colors
#
foreground #ddcf99
background #271719

color0  #574749
color8  #655757

color1  #96514b
color9  #b76051

color2  #7b7e63
color10 #99966d

color3  #c2855f
color11 #cba77a

color4  #7a6d79
color12 #92868b

color5  #49343d
color13 #533c44

color6  #7a6d79
color14 #92868b

color7  #b3a999
color15 #ddcf99
